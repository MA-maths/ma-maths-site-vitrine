    <!-- Bannière stage de mathématiques (niveau première) — visible jusqu'au 17 octobre 2026 inclus -->
    <style>
        .stage-banner { position: fixed; bottom: 0; left: 0; right: 0; background: linear-gradient(135deg, #1a237e 0%, #0d1b60 100%); color: #ffffff; text-align: center; padding: 18px 60px 18px 20px; z-index: 1100; box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.25); transform: translateY(110%); opacity: 0; transition: transform 0.6s ease, opacity 0.6s ease; }
        .stage-banner.show { transform: translateY(0); opacity: 1; }
        .stage-banner-link { display: block; max-width: 900px; margin: 0 auto; text-decoration: none; color: #ffffff; }
        .stage-banner-link:hover { color: #ffffff; }
        .stage-banner-title { font-family: 'Playfair Display', Georgia, serif; font-size: 1.15rem; font-weight: 700; margin: 0 0 4px; color: #ffffff; }
        .stage-banner-date { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 1.05rem; margin: 0; color: rgba(255, 255, 255, 0.95); }
        .stage-banner-close { position: absolute; top: 10px; right: 14px; background: none; border: none; color: rgba(255, 255, 255, 0.85); font-size: 1.3rem; line-height: 1; cursor: pointer; padding: 4px; }
        .stage-banner-close:hover { color: #ffffff; }
        @media (max-width: 600px) {
            .stage-banner { padding: 14px 50px 14px 16px; }
            .stage-banner-title { font-size: 1rem; }
            .stage-banner-date { font-size: 0.95rem; }
        }
    </style>
    <div class="stage-banner" id="stageBanner">
        <button class="stage-banner-close" id="stageBannerClose" aria-label="Fermer la bannière">&times;</button>
        <a class="stage-banner-link" href="cours-maths-angers.html#stageForm">
            <p class="stage-banner-title">Réservez la place de votre enfant pour un stage en mathématiques (niveau première)</p>
            <p class="stage-banner-date">Prochain stage : samedi 17 octobre 2026</p>
        </a>
    </div>
    <script>
        (function () {
            var banner = document.getElementById('stageBanner');
            if (!banner) { return; }
            var finDuStage = new Date('2026-10-18T00:00:00');
            if (Date.now() >= finDuStage.getTime()) { banner.remove(); return; }
            var dejaFerme = false;
            try { dejaFerme = sessionStorage.getItem('maMathsStageBannerFerme') === '1'; } catch (e) {}
            if (dejaFerme) { banner.remove(); return; }
            setTimeout(function () { banner.classList.add('show'); }, 10000);
            document.getElementById('stageBannerClose').addEventListener('click', function () {
                banner.classList.remove('show');
                try { sessionStorage.setItem('maMathsStageBannerFerme', '1'); } catch (e) {}
            });
        })();
    </script>
